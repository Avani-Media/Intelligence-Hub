<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avani Media Intelligence Hub</title>
<style>
html,body{margin:0;min-height:100%;background:#07100f;color:#eef7f3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.card{max-width:620px;border:1px solid rgba(192,231,216,.18);background:#0e1d1a;border-radius:20px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.32)}.card strong{display:block;font-size:20px;margin-bottom:8px}.card span{color:#9cb3aa;font-size:13px;line-height:1.55}.err{color:#ffaaaa!important;white-space:pre-wrap}
</style>
</head>
<body>
<div id="boot"><div class="card"><strong>Avani Intelligence Hub</strong><span id="status">Loading the latest Hub release…</span></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const runtime='https://iwuuilkuhltcffizbyyg.supabase.co/functions/v1/hub-runtime';
  try{
    const response=await fetch(runtime+'?t='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('Runtime request failed ('+response.status+')');
    const html=await response.text();
    if(!html||html.length<100000) throw new Error('Runtime returned an incomplete Hub release.');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('Avani Hub shell boot failed',error);
    status.className='err';
    status.textContent='Unable to load the Hub runtime.\n\n'+(error?.message||String(error));
  }
})();
</script>
</body>
</html>
